<style>
:root{
  --bg:#F0EEEB; --card:#FBFAF8; --ink:#26211F; --sub:#6B6360; --mut:#9C948F;
  --line:#DEDAD4; --line2:#E7E4DF; --acc:#6A2E4F; --acc-s:#EFE4EA; --on-acc:#FFFFFF;
  --och:#A77B2C; --board:#3A302C;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Noto Serif CJK SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#19171A;--card:#232024;--ink:#ECE7E4;--sub:#ABA3A0;--mut:#7E7774;
    --line:#37333A;--line2:#2B282E;--acc:#D59AB9;--acc-s:#35262F;--on-acc:#1B1519;--och:#D4AA5E;--board:#0C0B0D}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{max-width:920px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) max(18px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 100px) max(18px,env(safe-area-inset-left))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font:600 34px/1.1 var(--serif);letter-spacing:.1em;margin:0;cursor:pointer}
.top .r{display:flex;align-items:baseline;gap:14px;color:var(--sub);font-size:13px}
.lnk{background:none;border:0;padding:4px 2px;color:var(--acc);font-size:14px}

/* 书脊导航 */
.shelf{display:flex;align-items:flex-end;gap:5px;overflow-x:auto;padding:22px 6px 0;margin:10px -6px 0;border-bottom:8px solid var(--board);scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.sp{flex:1 1 0;min-width:36px;max-width:58px;border:0;border-radius:3px 3px 0 0;background:var(--c);color:#F6F1EB;padding:12px 0 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;transition:transform .18s ease;box-shadow:inset -4px 0 0 rgba(0,0,0,.14),inset 3px 0 0 rgba(255,255,255,.07)}
.sp .t{writing-mode:vertical-rl;font:500 15px/1 var(--serif);letter-spacing:.22em}
.sp .n{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.sp.on{transform:translateY(-12px)}
.sp:first-child{margin-left:auto}.sp:last-child{margin-right:auto}
.sp.home{background:var(--ink);color:var(--bg)}

.warn{background:#F6E3C8;color:#5B3D10;border-radius:8px;padding:12px 14px;margin:18px 0 0;font-size:14px}
.note{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:18px 0 0;font-size:14px;color:var(--sub)}

/* 首页摘抄 */
.qod{margin:30px 0 8px;padding:0 0 0 18px;border-left:3px solid var(--och)}
.qod blockquote{margin:0;font:19px/1.85 var(--serif);white-space:pre-wrap;cursor:pointer;max-width:36em}
.qod figcaption{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;color:var(--sub);font-size:13px}
.qod.empty p{font:17px/1.7 var(--serif);color:var(--sub);margin:0 0 10px}

.search{width:100%;margin:22px 0 4px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--sub);line-height:1.4}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .k{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

/* 时间线 */
.month{font:600 14px var(--serif);color:var(--sub);margin:26px 0 6px;letter-spacing:.05em}
.row{display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line2);padding:12px 2px}
.row .bar{width:4px;flex:0 0 4px;border-radius:2px;background:var(--c)}
.row .mid{flex:1;min-width:0}
.row .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ss{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ty{font-size:12px;color:var(--mut)}
.row .d{font-size:13px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}

/* 分类页通用 */
.vhead{display:flex;align-items:baseline;gap:14px;margin:28px 0 6px}
.vhead h2{font:600 26px/1.2 var(--serif);margin:0;letter-spacing:.06em}
.vhead .meta{color:var(--mut);font-size:13px}
.vhead .back{margin-left:auto}
.hint{color:var(--sub);font-size:14px;margin:6px 0 0;max-width:40em}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.sec{font:600 15px var(--serif);color:var(--sub);margin:26px 0 10px;letter-spacing:.05em}
.empty{border:1px dashed var(--line);border-radius:10px;padding:26px 20px;margin:20px 0;color:var(--sub);text-align:center;font-size:14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-size:14px;line-height:1.4}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.acc{border-color:var(--och);color:var(--och)}
.btn.warnbtn{color:#A33;border-color:#D9B3B3}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 10px}
.card .tt{font-weight:600}
.card .ss{font-size:13px;color:var(--sub);margin-top:2px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:6px;color:var(--sub);line-height:1.6}
.tag.st{border-color:var(--acc);color:var(--acc)}

/* 书 */
.glabel{font-size:13px;color:var(--sub);margin:22px 0 4px}
.spines{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;border-bottom:6px solid var(--board);padding:8px 2px 0;scrollbar-width:thin}
.bk{flex:0 0 auto;border:0;padding:12px 0;color:#F4EFE9;background:var(--c);border-radius:2px 2px 0 0;display:flex;justify-content:center;box-shadow:inset -4px 0 0 rgba(0,0,0,.16),inset 2px 0 0 rgba(255,255,255,.08)}
.bk span{writing-mode:vertical-rl;font:15px/1.25 var(--serif);letter-spacing:.12em;overflow:hidden;max-height:100%}
.dropped{color:var(--mut)}

/* 电影票根 */
.tk{display:flex;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;margin:0 0 12px;padding:0;overflow:visible}
.tk .stub{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px dashed var(--line);position:relative;background:var(--acc-s);border-radius:8px 0 0 8px}
.tk .stub::before,.tk .stub::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.tk .stub::before{top:-9px}.tk .stub::after{bottom:-9px}
.tk .stub b{font:600 24px/1 var(--serif)}
.tk .stub span{font-size:12px;color:var(--sub);margin-top:4px}
.tk .body{padding:12px 16px;flex:1;min-width:0}
.tk .tt{font:600 17px var(--serif)}
.tk .ss{font-size:13px;color:var(--sub)}
.scene{font:15px/1.75 var(--serif);color:var(--sub);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* 摘抄卡片 */
.qcards{columns:2 250px;column-gap:14px;margin-top:16px}
.qc{display:block;width:100%;break-inside:avoid;margin:0 0 14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;font:16px/1.8 var(--serif);white-space:pre-wrap;position:relative}
.qc .src{font:13px/1.5 var(--sans);color:var(--sub);margin-top:8px;white-space:normal}
.qc.un::after{content:"";position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--och)}

/* 旅行明信片 */
.cities{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 6px;font:16px var(--serif)}
.cities span{color:var(--mut);font:12px var(--sans);margin-left:3px}
.pc{display:grid;grid-template-columns:1fr auto;gap:4px 18px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 20px;margin:0 0 14px}
.pc .tt{font:600 18px var(--serif)}
.pc .ss{font-size:13px;color:var(--sub)}
.pc ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.pc .stamp{grid-column:2;grid-row:1/4;width:62px;height:74px;border:2px dotted var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 17px var(--serif);color:var(--acc);transform:rotate(3deg)}
.pc .stamp span{font:12px var(--sans);color:var(--sub)}

/* 歌词 */
.ly{border-left:4px solid var(--c)}
.ly .lines{font:15px/1.8 var(--serif);white-space:pre-wrap;color:var(--sub);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* 头脑风暴 */
.bs .q{font:600 16px/1.6 var(--serif)}
.bs .c{margin-top:8px;padding:8px 12px;background:var(--acc-s);border-radius:6px;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bs .c.none{background:none;border:1px dashed var(--line);color:var(--mut)}
.bs .m{font-size:12px;color:var(--mut);margin-top:8px}

/* 更多 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:16px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:14px 16px}
.tile .tt{font:600 16px var(--serif)}
.tile .ss{font-size:13px;color:var(--sub);margin-top:4px}

/* 弹出层 */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .bg{position:absolute;inset:0;background:rgba(20,14,18,.42)}
.sheet .panel{position:relative;background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom) + 28px);animation:up .2s ease}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:14px;max-height:86vh}}
@keyframes up{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-18px;background:var(--bg);padding:6px 0 10px;margin-top:-6px;z-index:2}
.sh-head h2{font:600 20px var(--serif);margin:0}
.sh-head .gp{display:flex;gap:6px}
.sh-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.fld{margin:14px 0}
.fld .l{font-size:13px;color:var(--sub);margin-bottom:6px}
.fld .chips{display:flex;flex-wrap:wrap;gap:6px}
.gch .gl{flex-basis:100%;font-size:12px;color:var(--mut);margin-top:4px}
.gch .gl:first-child{margin-top:0}
.chk{display:flex;align-items:center;gap:8px;font-size:15px}
.chk input{width:20px;height:20px}
input[type=text],input[type=date],input[type=url],input[type=search],textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 12px;font:16px/1.5 var(--sans);-webkit-appearance:none;appearance:none}
input[type=date]{min-height:44px}
textarea{min-height:90px;resize:vertical}
textarea.big{min-height:240px;font-family:var(--serif);line-height:1.8}
.d-title{font:600 22px/1.5 var(--serif);margin:4px 0 12px;white-space:pre-wrap}
.d-title.quote{font-weight:400;font-size:20px;line-height:1.85}
.d-f{margin:14px 0}
.d-l{font-size:12px;color:var(--mut);margin-bottom:2px}
.d-v{white-space:pre-wrap;word-break:break-word}
.d-v.big{font:16px/1.9 var(--serif)}
.d-v ul{margin:0;padding-left:18px}
.d-v a{color:var(--acc);word-break:break-all}
details{margin:16px 0;border-top:1px solid var(--line);padding-top:10px}
summary{color:var(--sub);font-size:14px}
.draft{margin:12px 0;padding:10px 12px;background:var(--card);border-radius:6px;font:14px/1.8 var(--serif);white-space:pre-wrap}
.draft b{display:block;font:12px var(--sans);color:var(--mut)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.types button{text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:12px 14px;font:15px var(--serif)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0 12px}
.prog i{display:block;height:100%;background:var(--och)}
.rvbtns{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:18px}
.rvbtns .btn{padding:12px}
.prev{margin-top:14px}
.prev .qc{font-size:15px}
.set h3{font:600 15px var(--serif);margin:22px 0 6px}
.set p{margin:4px 0;color:var(--sub);font-size:14px}

.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:40;background:var(--acc);color:var(--on-acc);border:0;border-radius:24px;padding:12px 20px;font:500 15px var(--sans);box-shadow:0 6px 18px rgba(60,20,40,.28)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:90vw}
#toast[hidden]{display:none}
#toast button{background:none;border:0;color:var(--och);font-weight:600;padding:0}
@media (max-width:520px){.qcards{columns:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1 data-act="nav" data-v="home">架子</h1>
    <div class="r"><span id="today"></span><button class="lnk" data-act="settings">备份与设置</button></div>
  </header>
  <nav class="shelf" id="nav"></nav>
  <main id="view"></main>
</div>
<button class="fab" id="fab" data-act="fab">记一样</button>
<div class="sheet" id="sheet" hidden><div class="bg" data-act="bg"></div><div class="panel" id="panel"></div></div>
<div id="toast" hidden></div>

 event:{n:'演出和活动',sn:'演出',add:'加一场演出',c:'#8A4A5C',tk:'title',d:'演唱会、见面会、应援',f:[

const dayOf=ts=>ymd(new Date((ts||Date.now())-4*3600e3));

function fmtDate(d){if(!d)return'';const [y,m,dd]=d.split('-').map(Number);const cy=+today().slice(0,4);return (y!==cy?y+'年':'')+m+'月'+dd+'日';}
function hash(s){let h=0;s=String(s);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}

function titleOf(i){const T=TYPES[i.type];let v=i[T.tk];if(!v&&i.type==='industry')v=i.body;return cut(v,60)||'（没写标题）';}
function dateOf(i){return i.end||i.date||i.start||dayOf(i.created);}
function srcLine(i){return [i.author,i.source].filter(Boolean).join('　');}
function subOf(i){
  const j=a=>a.filter(Boolean).join('　');
  switch(i.type){
    case 'book':return j([i.author,i.status]);
    case 'film':return j([i.director,i.scene?cut(i.scene,40):'']);
    case 'quote':return srcLine(i);
    case 'trip':return j([(i.cities||[]).join('、'),i.with]);
    case 'lyric':return j([i.status,(i.drafts&&i.drafts.length)?'第 '+(i.drafts.length+1)+' 稿':'']);
    case 'industry':return i.title?cut(i.body,40):(i.tags||[]).join('、');
    case 'brain':return j([i.status,i.conclusion?cut(i.conclusion,40):'']);
    case 'work':return j([i.kind,i.status]);
    case 'event':return j([i.who,i.place]);
    case 'family':return j([i.era,(i.people||[]).join('、')]);
    case 'idea':return i.project||'';
    case 'word':return j([i.lang,i.meaning]);
    case 'song':return i.artist||'';
    case 'watch':return j([i.kind,i.status]);
  }
  return '';
}
function hay(i){return Object.values(i).map(v=>Array.isArray(v)?v.map(x=>typeof x==='object'?JSON.stringify(x):x).join(' '):(typeof v==='string'?v:'')).join(' ').toLowerCase();}

function timelineHTML(){
  if(!S.items.length)return empty('架子还是空的。点右下角「记一样」放第一样东西，或者先把摘抄导进来。');
  const q=F.q.trim().toLowerCase();
  let items=S.items.slice();
  if(F.home!=='all')items=items.filter(i=>i.type===F.home);
  if(q)items=items.filter(i=>hay(i).includes(q));
  if(!items.length)return empty(q?'没搜到。换个词试试。':'这一类还没有东西。');
  items.sort((a,b)=>dateOf(b).localeCompare(dateOf(a))||(b.created||0)-(a.created||0));
  const rows=[],seen={};
  items.forEach(i=>{
    if(!q&&i.batch){if(seen[i.batch]){seen[i.batch].n++;return;}const r={batch:i.batch,n:1,it:i};seen[i.batch]=r;rows.push(r);}
    else rows.push({it:i});
  });
  let h='',m='';
  rows.forEach(r=>{
    const d=dateOf(r.it),mm=d.slice(0,7);

  });
  return h;
}

function collect(root,fields){

/* 【栏目】格式解析 */
function matchField(T,l){
  return T.f.find(f=>f.l===l||(f.a||[]).includes(l))
      || T.f.find(f=>l.includes(f.l)||f.l.includes(l)||(f.a||[]).some(a=>l.includes(a)));
}
function convert(f,val){
  if(f.t==='lines')return val.split('\n').map(s=>s.replace(/^\s*(?:[-•·*]|\d+[.、．)])\s*/,'').trim()).filter(Boolean);
  if(f.t==='tags')return splitTags(val);
  if(f.t==='gchips'){const all=f.g.flatMap(x=>x[1]);const hit=all.filter(o=>val.includes(o));return hit.length===1?hit[0]:'';}
  if(f.t==='chips'){const hit=f.o.filter(o=>val.includes(o));return hit.length===1?hit[0]:(f.o.find(o=>val.trim()===o)||'');}
  if(f.t==='date'){const m=val.match(/(\d{4})[-./年](\d{1,2})[-./月](\d{1,2})/);return m?m[1]+'-'+pad(m[2])+'-'+pad(m[3]):'';}
  if(f.t==='check')return /是|有|对|yes|true/i.test(val);
  if(f.t==='url'){const m=val.match(/https?:\/\/\S+/);return m?m[0]:val.trim();}
  return val.trim();
}
function parseTagged(txt,type){
  const T=TYPES[type],out={},marks=[],re=/【([^】\n]+)】/g;let m;
  while((m=re.exec(txt)))marks.push({l:m[1].trim(),s:m.index,e:re.lastIndex});
  marks.forEach((mk,i)=>{
    const raw=txt.slice(mk.e,i+1<marks.length?marks[i+1].s:txt.length).trim();
    const f=matchField(T,mk.l);
    if(f&&raw)out[f.k]=convert(f,raw);
  });
  return out;
}

/* ---------- 摘抄导入 ---------- */
function guessLang(s){
  const cnt=r=>(s.match(r)||[]).length;
  const han=cnt(/[\u4e00-\u9fff]/g),kr=cnt(/[\uac00-\ud7af]/g),kana=cnt(/[\u3040-\u30ff]/g),lat=cnt(/[a-zA-ZäöüÄÖÜß]/g);
  const max=Math.max(han,kr,kana,lat);if(!max)return '';
  if(kr===max)return '韩';
  if(kana&&kana>=han*0.2&&(kana+han)>=lat)return '日';
  if(han===max)return '中';
  if(/[äöüßÄÖÜ]/.test(s))return '德';
  const w=s.toLowerCase().match(/[a-z]+/g)||[];
  const de=['der','die','das','und','ist','nicht','ich','ein','eine','zu','mit','sich','auf','für','den','dem','wir','sie','es','wenn','man','auch','nur','noch','wie','kein','mein','dein','ohne','aber','doch','nichts','immer','was','wer','hat','sind','sein','uns','du'];
  const en=['the','and','is','of','to','you','i','a','in','that','it','my','me','your','be','not','we','are','with','for','but','all','love','never','what','this','have','when','will'];
  let d=0,e=0;w.forEach(x=>{if(de.includes(x))d++;if(en.includes(x))e++;});
  return d>e?'德':'英';
}
function parseOne(b){
  b=b.replace(/^\s*(?:\d{1,3}[.、．)]|[-•·*])\s+/,'');
  const lines=b.split('\n').map(s=>s.trim()).filter(Boolean);
  let source='';
  const srcRe=/^(?:——|—|--|－－|–)\s*/;
  if(lines.length>1){
    const last=lines[lines.length-1];
    if(srcRe.test(last)||/^《[^》]+》$/.test(last)){source=lines.pop().replace(srcRe,'');}
  }
  let text=lines.join('\n');
  if(!source){
    const m=text.match(/^([\s\S]+?)\s*(?:——|--|\s[—–]\s?)\s*([^—–\n。！？!?.]{1,30})$/);
    if(m&&m[1].trim().length>=2){text=m[1].trim();source=m[2].trim();}
  }
  return {text,source,lang:guessLang(text)};
}
function splitQuotes(txt,mode){
  txt=String(txt||'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ').trim();
  if(!txt)return [];
  let blocks;
  if(mode==='line')blocks=txt.split('\n');
  else if(mode==='blank')blocks=txt.split(/\n\s*\n+/);
  else blocks=/\n\s*\n/.test(txt)?txt.split(/\n\s*\n+/):txt.split('\n');
  return blocks.map(x=>x.trim()).filter(Boolean).map(parseOne).filter(q=>q.text);
}

async function exportData(){
  const txt=JSON.stringify(S,null,1),name=backupName();
  let file=null;try{file=new File([txt],name,{type:'application/json'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});S.lastBackup=Date.now();save();render();toast('备份导出了');return;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  S.lastBackup=Date.now();save();render();toast('备份导出了');
}
function mergeIn(data){
  if(!data||!Array.isArray(data.items))throw new Error('不是架子的备份文件');
  const map=new Map(S.items.map(i=>[i.id,i]));let add=0,upd=0;
  data.items.forEach(i=>{
    if(!i||!i.id||!TYPES[i.type])return;
    const cur=map.get(i.id);
    if(!cur){S.items.push(i);map.set(i.id,i);add++;}
    else if((i.updated||0)>(cur.updated||0)){Object.assign(cur,i);upd++;}
  });
  save();return {add,upd};
}

/* ---------- 设置 ---------- */
function openSettings(){
  const me=(localStorage.getItem(KEY)||'').length,sd=(localStorage.getItem(SD_KEY)||'').length;
  const kb=n=>n<1024?n+' 字节':(n/1024).toFixed(n<102400?1:0)+' KB';
  const counts=MAIN.map(k=>[TYPES[k].n,byType(k).length]).filter(x=>x[1]);
  sheet(`<div class="sh-head"><h2>备份与设置</h2><button class="lnk" data-act="close">关闭</button></div><div class="set">
<h3>备份</h3><p>数据只存在这台设备的浏览器里，不会上传。换设备或者清浏览器数据之前，一定先导出。</p>
<p>上次备份：${S.lastBackup?fmtDate(dayOf(S.lastBackup))+'（'+Math.floor((Date.now()-S.lastBackup)/864e5)+' 天前）':'还没有'}</p>
<div class="actions"><button class="btn pri" data-act="export">导出备份</button><button class="btn" data-act="pickFile">从备份文件恢复</button></div>
<p>恢复是合并进来：已经有的条目保留较新的那份，不会整个覆盖。</p>
<h3>现在架子上有</h3><p>${counts.length?counts.map(([n,c])=>n+' '+c).join('，'):'还没有东西'}</p>
<h3>空间</h3><p>架子用了 ${kb(me*2)}${sd?'，Study Desk 用了 '+kb(sd*2):''}。两个一起大约能用 5 MB，纯文字很难用满。</p>
<h3>清空</h3><p>把架子上所有东西删掉。Study Desk 不受影响。</p>
<div class="actions"><button class="btn warnbtn" data-act="clearAll">清空架子</button></div>
</div>`,'view');
}

/* ---------- 剪贴板 ---------- */
async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t);toast(msg||'复制好了');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast(msg||'复制好了');}catch(e){toast('复制失败，长按手动复制');}ta.remove();
}

/* ---------- 事件 ---------- */
function openTypePicker(){
  const b=k=>`<button style="--c:${TYPES[k].c}" data-act="add" data-t="${k}">${TYPES[k].n}</button>`;
  sheet(`<div class="sh-head"><h2>记一样</h2><button class="lnk" data-act="close">取消</button></div><div class="types">${MAIN.map(b).join('')}</div>`,'view');
}
function act(a,el){
  const id=el.dataset.id,val=el.dataset.val;
  switch(a){
    case 'nav':S.ui.view=el.dataset.v;if(S.ui.view==='other')F.other='';save();render();window.scrollTo(0,0);break;
    case 'fab':{const t=S.ui.view==='other'?F.other:S.ui.view;if(TYPES[t])openForm(t);else openTypePicker();break;}
    case 'add':openForm(el.dataset.t);break;
    case 'open':openDetail(id);break;
    case 'edit':openForm(get(id).type,id);break;
    case 'del':removeItem(id);closeSheet();render();toast('删掉了',{label:'撤销',act:'undo'});break;
    case 'undo':undoDel();break;
    case 'close':closeSheet();break;
    case 'bg':if(sheetMode==='view')closeSheet();break;
    case 'save':saveForm();break;
    case 'fchip':{const g=el.parentElement;const was=el.classList.contains('on');g.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));if(!was)el.classList.add('on');break;}
    case 'pasteBox':{const w=$('#pasteWrap');w.hidden=!w.hidden;if(!w.hidden)$('#pasteTxt').focus();break;}
    case 'applyPaste':{const fm=$('#fm'),t=fm.dataset.t,o=parseTagged($('#pasteTxt').value,t);const n=Object.keys(o).length;if(!n){toast('没认出【栏目名】，检查一下格式');break;}fill(fm,TYPES[t].f,o);$('#pasteWrap').hidden=true;toast('填好了 '+n+' 栏，检查一下再保存');break;}
    case 'brainPaste':openForm('brain',null,{paste:true});break;
    case 'copyPrompt':copyText(BRAIN_PROMPT,'整理指令复制好了，发给 Claude 就行');break;
    case 'copyQuote':{const it=get(id);copyText(it.text+(srcLine(it)?'\n—— '+srcLine(it):''));break;}
    case 'otherOpen':F.other=val;render();window.scrollTo(0,0);break;
    case 'otherBack':F.other='';render();break;
    case 'shuffle':{const qs=byType('quote');if(qs.length>1){let n;do{n=qs[Math.floor(Math.random()*qs.length)].id;}while(n===qodId);qodId=n;}render();break;}
    case 'hf':F.home=val;render();break;
    case 'qlang':F.qlang=val;render();break;
    case 'qline':F.qline=val;F.qtheme='';render();break;
    case 'qtheme':F.qtheme=val;render();break;
    case 'itag':F.itag=val;render();break;
    case 'bst':F.bst=val;render();break;
    case 'qimport':openQImport();break;
    case 'qimode':qiMode=val;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));if(QI!==null)previewQ();break;
    case 'qpreview':previewQ();break;
    case 'qconfirm':confirmQ();break;
    case 'review':openReview();break;
    case 'rvKeep':{const it=rvSaveEdits();if(it){it.reviewed=true;delete it.skip;save();}openReview();break;}
    case 'rvSkip':{const it=rvSaveEdits();if(it){it.skip=Date.now();save();}openReview();break;}
    case 'rvDel':{const rv=$('#rv');removeItem(rv.dataset.id);openReview();toast('删掉了',{label:'撤销',act:'undo'});break;}
    case 'closeReview':closeSheet();render();break;
    case 'settings':openSettings();break;
    case 'export':exportData();break;
    case 'pickFile':$('#fileIn').value='';$('#fileIn').click();break;
    case 'clearAll':
      if(!confirm('确定清空架子上所有东西？'))break;
      if(!confirm('再确认一次：清空之后找不回来，除非你有备份。'))break;
      S=blank();save();closeSheet();render();toast('清空了');break;
  }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;e.preventDefault();act(el.dataset.act,el);});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.search){F[t.dataset.search]=t.value;const box=document.getElementById(t.dataset.box);if(box)box.innerHTML=t.dataset.search==='q'?timelineHTML():quoteListHTML();}
});
$('#fileIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      const {add,upd}=mergeIn(data);closeSheet();render();toast(`恢复好了：新加 ${add} 条，更新 ${upd} 条`);
    }catch(err){toast('读不了这个文件：'+(err.message||'格式不对'));}
  };
  r.readAsText(f);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden&&sheetMode==='view')closeSheet();});
render();
</script>
